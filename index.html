<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🏎️ Carreras Multijugador</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: linear-gradient(180deg, #87CEEB 0%, #90EE90 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; overflow: hidden; }
        
        h1 { color: #d32f2f; font-size: 1.6rem; margin: 10px 0; text-shadow: 2px 2px 0 #fff; text-align: center; }
        .pantalla { width: 100%; max-width: 450px; }
        .oculto { display: none !important; }
        
        .caja { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.2); text-align: center; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin: 6px 0; transition: transform 0.1s; }
        .btn:active { transform: scale(0.97); }
        .rojo { background: #d32f2f; color: white; }
        .verde { background: #2e7d32; color: white; }
        .azul { background: #1976d2; color: white; }
        .naranja { background: #f57c00; color: white; }
        .gris { background: #757575; color: white; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem; margin-bottom: 10px; }
        .estado { padding: 10px; border-radius: 8px; margin: 10px 0; }
        .buscando { background: #fff3e0; color: #e65100; animation: parpadeo 1s infinite; }
        .listo { background: #e8f5e9; color: #2e7d32; }
        @keyframes parpadeo { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        /* CALLE Y COCHES */
        .calle { width: 100%; height: 85vh; max-height: 700px; background: #424242; border-radius: 12px; position: relative; overflow: hidden; border: 8px solid #333; }
        .linea-centro { position: absolute; left: 50%; width: 6px; height: 100%; transform: translateX(-50%); }
        .linea { position: absolute; left: 50%; width: 6px; height: 50px; background: #ffeb3b; transform: translateX(-50%); }
        .auto { position: absolute; width: 45px; height: 75px; border-radius: 8px; transition: left 0.08s ease-out; }
        .tu-auto { background: linear-gradient(180deg, #2196f3, #1565c0); border: 3px solid #0d47a1; z-index: 10; box-shadow: 0 0 10px rgba(33,150,243,0.5); }
        .auto-rival { background: linear-gradient(180deg, #f44336, #c62828); border: 3px solid #b71c1c; z-index: 9; }
        .auto-nombre { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 0.7rem; font-weight: bold; color: white; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; }
        
        .info { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 20; flex-wrap: wrap; gap: 5px; }
        .info-caja { background: rgba(0,0,0,0.6); color: white; padding: 6px 10px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; }
        
        /* CONTROLES */
        .controles { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 30px; z-index: 20; }
        .ctrl { width: 80px; height: 80px; border-radius: 50%; border: none; background: rgba(255,255,255,0.95); font-size: 2rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); touch-action: manipulation; }
        .ctrl:active { transform: scale(0.9); background: #e0e0e0; }
        
        /* META */
        .meta { position: absolute; top: 0; left: 0; right: 0; height: 30px; background: repeating-linear-gradient(90deg, #000 0px, #000 20px, #fff 20px, #fff 40px); z-index: 5; }
        .contra { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .contra-caja { background: white; padding: 30px; border-radius: 16px; text-align: center; }
        .puesto { font-size: 2rem; font-weight: bold; margin: 10px 0; }
        .primero { color: #f57c00; }
        .segundo { color: #757575; }
    </style>
</head>
<body>

<!-- ==============================================
    🔧 REEMPLAZÁ TUS DATOS DE FIREBASE ACÁ ABAJO
============================================== -->
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDSUzrZ27n9yfzY5jAmKy6tVj3tkT_rkLk",
  authDomain: "carreras-veloces.firebaseapp.com",
  projectId: "carreras-veloces",
  storageBucket: "carreras-veloces.firebasestorage.app",
  messagingSenderId: "80246776052",
  appId: "1:80246776052:web:e3f3f2bc2ac5c3347f7ea1",
  measurementId: "G-3ZKRGYCCRR"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
</script>

<!-- PANTALLA DE INICIO -->
<div class="pantalla" id="inicio">
    <h1>🏎️ CARRERAS VELOCES — MULTIJUGADOR</h1>
    <div class="caja">
        <input type="text" id="nombre" placeholder="Tu nombre" maxlength="12">
        <button class="btn verde" onclick="entrar()">🎮 Buscar carrera</button>
        <button class="btn azul" onclick="crearSala()">➕ Crear sala privada</button>
        
        <div id="estadoConexion" style="margin-top:10px; color:#666;">Conectando...</div>
    </div>
</div>

<!-- BUSCANDO -->
<div class="pantalla oculto" id="buscando">
    <h1>🔍 Buscando rival...</h1>
    <div class="caja">
        <div class="estado buscando" id="textoEstado">Esperando a otro corredor...</div>
        <p id="codigoSala" style="margin:15px 0; font-weight:bold; color:#1976d2;"></p>
        <button class="btn gris" onclick="cancelar()">❌ Cancelar</button>
    </div>
</div>

<!-- JUEGO -->
<div class="pantalla oculto" id="pantallaJuego">
    <div class="calle" id="calle">
        <div class="meta"></div>
        <div class="info">
            <div class="info-caja">🏁 Vuelta: <span id="vuelta">1</span>/2</div>
            <div class="info-caja">⏱️ <span id="tiempo">0.0</span>s</div>
            <div class="info-caja">🏆 Puesto: <span id="puesto">1°</span></div>
        </div>
        <div class="linea-centro" id="lineas"></div>
        
        <!-- Tu auto -->
        <div class="auto tu-auto" id="tuAuto">
            <span class="auto-nombre" id="tuNombreAuto">Tú</span>
        </div>
        
        <!-- Auto rival -->
        <div class="auto auto-rival" id="autoRival">
            <span class="auto-nombre" id="nombreRival">Rival</span>
        </div>
        
        <div class="controles">
            <button class="ctrl" id="btnIzq">←</button>
            <button class="ctrl" id="btnDer">→</button>
        </div>
    </div>
</div>

<!-- RESULTADO -->
<div class="pantalla oculto" id="pantallaFin">
    <div class="contra">
        <div class="contra-caja">
            <h2 id="tituloFin">🏆 ¡Terminaste!</h2>
            <p class="puesto" id="puestoFin">1° Lugar</p>
            <p>Tiempo: <span id="tiempoFin">0.0</span>s</p>
            <button class="btn verde" onclick="location.reload()">🔄 Otra carrera</button>
            <button class="btn azul" onclick="location.reload()">🏠 Menú</button>
        </div>
    </div>
</div>

<script>
// Variables
let uid = null;
let nombreJugador = '';
let salaId = null;
let miRol = null; // 'jugador1' o 'jugador2'
let miCarril = 1; // 0, 1, 2 (carriles)
let posY = 0;
let jugando = false;
let meta = false;
let tiempoInicio = 0;
let vueltasCompletadas = 0;
const TOTAL_VUELTAS = 2;
const ANCHO_CALLE = 450;
const CARRILES = [60, 170, 280]; // posiciones X de los carriles

// Referencias
const tuAuto = document.getElementById('tuAuto');
const autoRival = document.getElementById('autoRival');
const calle = document.getElementById('calle');

// Conexión
db.ref('.info/connected').on('value', snap => {
    document.getElementById('estadoConexion').textContent = 
        snap.val() === true ? '✅ Conectado' : '❌ Sin conexión';
});

// Entrar al juego
function entrar() {
    nombreJugador = document.getElementById('nombre').value.trim() || 'Corredor';
    
    // Buscar sala disponible
    db.ref('salas').orderByChild('estado').equalTo('esperando').limitToFirst(1).once('value')
        .then(snapshot => {
            let salaEncontrada = null;
            snapshot.forEach(child => { salaEncontrada = {id: child.key, ...child.val()}; });
            
            if (salaEncontrada) {
                unirseASala(salaEncontrada);
            } else {
                crearSala();
            }
        });
}

// Crear sala nueva
function crearSala() {
    miRol = 'jugador1';
    miCarril = 0;
    posY = 0;
    
    const salaRef = db.ref('salas').push();
    salaId = salaRef.key;
    
    const sala = {
        jugador1: { nombre: nombreJugador, carril: miCarril, posY: 0, listo: true },
        jugador2: null,
        estado: 'esperando',
        creado: firebase.database.ServerValue.TIMESTAMP
    };
    
    salaRef.set(sala);
    document.getElementById('inicio').classList.add('oculto');
    document.getElementById('buscando').classList.remove('oculto');
    document.getElementById('codigoSala').textContent = `Código: ${salaId}`;
    
    // Escuchar cambios
    salaRef.on('value', escucharSala);
}

// Unirse a sala existente
function unirseASala(sala) {
    miRol = 'jugador2';
    miCarril = 2;
    posY = 0;
    salaId = sala.id;
    
    db.ref('salas/' + salaId).update({
        jugador2: { nombre: nombreJugador, carril: miCarril, posY: 0, listo: true },
        estado: 'jugando'
    });
    
    document.getElementById('inicio').classList.add('oculto');
    document.getElementById('buscando').classList.remove('oculto');
    document.getElementById('textoEstado').textContent = '¡Conectado! Iniciando carrera...';
    
    db.ref('salas/' + salaId).on('value', escucharSala);
}

// Crear sala privada
function crearSala() {
    entrar();
}

// Escuchar estado de la sala
function escucharSala(snapshot) {
    const sala = snapshot.val();
    if (!sala) return;
    
    // Cuando ambos están listos
    if (sala.estado === 'jugando' && sala.jugador1 && sala.jugador2) {
        if (!jugando) iniciarCarrera(sala);
    }
    
    // Actualizar posiciones
    if (sala.jugador1 && sala.jugador2) {
        const j1 = sala.jugador1;
        const j2 = sala.jugador2;
        
        if (miRol === 'jugador1') {
            // Yo soy j1, rival es j2
            actualizarAuto(tuAuto, j1.carril, j1.posY);
            document.getElementById('tuNombreAuto').textContent = j1.nombre;
            actualizarAuto(autoRival, j2.carril, j2.posY);
            document.getElementById('nombreRival').textContent = j2.nombre;
            actualizarPuesto(j1.posY, j2.posY);
        } else {
            // Yo soy j2, rival es j1
            actualizarAuto(tuAuto, j2.carril, j2.posY);
            document.getElementById('tuNombreAuto').textContent = j2.nombre;
            actualizarAuto(autoRival, j1.carril, j1.posY);
            document.getElementById('nombreRival').textContent = j1.nombre;
            actualizarPuesto(j2.posY, j1.posY);
        }
    }
    
    // Fin de carrera
    if (sala.estado === 'terminada' && !meta) {
        meta = true;
        terminarCarrera(sala.resultado);
    }
}

// Iniciar carrera
function iniciarCarrera(sala) {
    jugando = true;
    document.getElementById('buscando').classList.add('oculto');
    document.getElementById('pantallaJuego').classList.remove('oculto');
    
    // Dibujar líneas de la calle
    dibujarLineas();
    
    tiempoInicio = Date.now();
    document.getElementById('tiempo').textContent = '0.0';
    
    // Actualizar tiempo cada 100ms
    setInterval(() => {
        if (!jugando) return;
        const transcurrido = ((Date.now() - tiempoInicio)/1000).toFixed(1);
        document.getElementById('tiempo').textContent = transcurrido;
    }, 100);
}

// Dibujar líneas amarillas
function dibujarLineas() {
    const cont = document.getElementById('lineas');
    for (let i = 0; i < 20; i++) {
        const l = document.createElement('div');
        l.className = 'linea';
        l.style.top = `${i * 80}px`;
        cont.appendChild(l);
    }
}

// Mover auto
function mover(direccion) {
    if (!jugando || !salaId) return;
    
    // Cambiar de carril
    if (direccion === 'izq' && miCarril > 0) miCarril--;
    if (direccion === 'der' && miCarril < 2) miCarril++;
    
    // Avanzar
    posY += 8;
    if (posY >= 100) {
        posY = 0;
        vueltasCompletadas++;
        document.getElementById('vuelta').textContent = Math.min(vueltasCompletadas + 1, TOTAL_VUELTAS);
        
        // Chequear si terminó
        if (vueltasCompletadas >= TOTAL_VUELTAS && miRol === 'jugador1') {
            jugando = false;
            db.ref('salas/' + salaId).update({
                estado: 'terminada',
                resultado: miRol
            });
            return;
        }
    }
    
    // Sincronizar con Firebase
    const miRef = db.ref(`salas/${salaId}/${miRol}`);
    miRef.update({ carril: miCarril, posY: posY });
}

// Actualizar posición visual
function actualizarAuto(elemento, carril, posicion) {
    const h = calle.clientHeight - 75;
    elemento.style.left = `${CARRILES[carril]}px`;
    elemento.style.top = `${(1 - posicion/100) * h}px`;
}

// Actualizar puesto
function actualizarPuesto(miPos, rivalPos) {
    const puesto = miPos >= rivalPos ? '1°' : '2°';
    document.getElementById('puesto').textContent = puesto;
}

// Terminar carrera
function terminarCarrera(ganadorRol) {
    jugando = false;
    const gane = ganadorRol === miRol;
    
    document.getElementById('pantallaJuego').classList.add('oculto');
    document.getElementById('pantallaFin').classList.remove('oculto');
    
    document.getElementById('tituloFin').textContent = gane ? '🏆 ¡GANASTE!' : '😔 Perdiste';
    document.getElementById('puestoFin').textContent = gane ? '1° Lugar' : '2° Lugar';
    document.getElementById('puestoFin').className = `puesto ${gane ? 'primero' : 'segundo'}`;
    document.getElementById('tiempoFin').textContent = ((Date.now() - tiempoInicio)/1000).toFixed(1);
    
    // Borrar sala después de 5s
    setTimeout(() => {
        if (salaId) db.ref('salas/' + salaId).remove();
    }, 5000);
}

function cancelar() {
    if (salaId) db.ref('salas/' + salaId).remove();
    location.reload();
}

// Controles
document.getElementById('btnIzq').addEventListener('click', () => mover('izq'));
document.getElementById('btnDer').addEventListener('click', () => mover('der'));

document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') mover('izq');
    if (e.key === 'ArrowRight') mover('der');
});
</script>
</body>
</html>
